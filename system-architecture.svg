<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="EchoMind V2 hexagonal architecture: devices, adapters, infrastructure services, pure domain and outputs">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#101a2c"/>
    </linearGradient>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="a2d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1400" height="980" fill="url(#bg2)"/>
  <text x="50" y="58" fill="#f8fafc" font-size="34" font-weight="700">EchoMind V2 — System Architecture (hexagonal)</text>
  <text x="50" y="88" fill="#94a3b8" font-size="16">source of truth: src/main.py composition root · domain is pure stdlib · adapters own all IO</text>

  <!-- Devices / transport -->
  <rect x="50" y="120" width="1300" height="110" rx="14" fill="#0e1626" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="70" y="150" fill="#7dd3fc" font-size="15" font-weight="700">ENTRIES · devices &amp; transport</text>
  <rect x="80" y="165" width="270" height="48" rx="10" fill="#16233c" stroke="#38bdf8"/>
  <text x="215" y="195" fill="#f8fafc" font-size="15" text-anchor="middle">Alexa+ → MCP /mcp</text>
  <rect x="380" y="165" width="270" height="48" rx="10" fill="#16233c" stroke="#38bdf8"/>
  <text x="515" y="195" fill="#f8fafc" font-size="15" text-anchor="middle">Android IP Webcam</text>
  <rect x="680" y="165" width="270" height="48" rx="10" fill="#16233c" stroke="#38bdf8"/>
  <text x="815" y="195" fill="#f8fafc" font-size="15" text-anchor="middle">Vivotek FD8367</text>
  <rect x="980" y="165" width="340" height="48" rx="10" fill="#16233c" stroke="#38bdf8"/>
  <text x="1150" y="195" fill="#f8fafc" font-size="15" text-anchor="middle">Control Center /dashboard (SSE)</text>

  <!-- Adapters -->
  <rect x="50" y="270" width="470" height="330" rx="14" fill="#0f1a2e" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="70" y="300" fill="#67e8f9" font-size="15" font-weight="700">ADAPTERS · infrastructure/adapters</text>
  <rect x="75" y="315" width="420" height="42" rx="8" fill="#12213b" stroke="#22d3ee"/>
  <text x="285" y="342" fill="#e2e8f0" font-size="13" text-anchor="middle">mcp/fastapi_mcp_adapter.py  (InMemoryMCPServer, FastAPIMCPServer)</text>
  <rect x="75" y="365" width="420" height="42" rx="8" fill="#12213b" stroke="#22d3ee"/>
  <text x="285" y="392" fill="#e2e8f0" font-size="13" text-anchor="middle">mcp/tool_resolvers.py  (agentic catalog + ambient + reminders)</text>
  <rect x="75" y="415" width="420" height="42" rx="8" fill="#12213b" stroke="#22d3ee"/>
  <text x="285" y="442" fill="#e2e8f0" font-size="13" text-anchor="middle">mcp/memory_resolvers.py  (memory_converse + V1 tools)</text>
  <rect x="75" y="465" width="420" height="42" rx="8" fill="#12213b" stroke="#22d3ee"/>
  <text x="285" y="492" fill="#e2e8f0" font-size="13" text-anchor="middle">mcp/recall_resolvers.py  (memory_recall · A1/A2)</text>
  <rect x="75" y="515" width="420" height="42" rx="8" fill="#12213b" stroke="#22d3ee"/>
  <text x="285" y="542" fill="#e2e8f0" font-size="13" text-anchor="middle">mcp/web_dashboard.py · session_manager.py · boto3/camera adapters</text>

  <!-- Infrastructure services -->
  <rect x="540" y="270" width="470" height="330" rx="14" fill="#141326" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="560" y="300" fill="#fcd34d" font-size="15" font-weight="700">INFRASTRUCTURE SERVICES · infrastructure/services</text>
  <rect x="565" y="315" width="420" height="42" rx="8" fill="#1b1730" stroke="#f59e0b"/>
  <text x="775" y="342" fill="#e2e8f0" font-size="13" text-anchor="middle">ambient_watch_service.py  (AmbientWatchService)</text>
  <rect x="565" y="365" width="420" height="42" rx="8" fill="#1b1730" stroke="#f59e0b"/>
  <text x="775" y="392" fill="#e2e8f0" font-size="13" text-anchor="middle">memory_bridge.py  (MemoryBridge — passive EventHub consumer)</text>
  <rect x="565" y="415" width="420" height="42" rx="8" fill="#1b1730" stroke="#f59e0b"/>
  <text x="775" y="442" fill="#e2e8f0" font-size="13" text-anchor="middle">memory_service.py  (VectorMemoryService, MemoryRecord)</text>
  <rect x="565" y="465" width="420" height="42" rx="8" fill="#1b1730" stroke="#f59e0b"/>
  <text x="775" y="492" fill="#e2e8f0" font-size="13" text-anchor="middle">recall_engine.py  (RecallEngine) · memory_timeline.py (Episode)</text>
  <rect x="565" y="515" width="420" height="42" rx="8" fill="#1b1730" stroke="#f59e0b"/>
  <text x="775" y="542" fill="#e2e8f0" font-size="13" text-anchor="middle">sensor_bus.py · demo_seed_service.py · config/event_hub.py · telemetry</text>

  <!-- Domain -->
  <rect x="1030" y="270" width="320" height="330" rx="14" fill="#0d2116" stroke="#4ade80" stroke-width="1.5"/>
  <text x="1050" y="300" fill="#86efac" font-size="15" font-weight="700">PURE DOMAIN · domain/services</text>
  <text x="1050" y="326" fill="#94a3b8" font-size="12">stdlib only · no framework · no IO</text>
  <rect x="1050" y="340" width="280" height="34" rx="7" fill="#12261b" stroke="#4ade80"/>
  <text x="1190" y="362" fill="#e2e8f0" font-size="12" text-anchor="middle">memory_intent.py · query_router.py</text>
  <rect x="1050" y="382" width="280" height="34" rx="7" fill="#12261b" stroke="#4ade80"/>
  <text x="1190" y="404" fill="#e2e8f0" font-size="12" text-anchor="middle">recall_planner.py · recall_plan.py</text>
  <rect x="1050" y="424" width="280" height="34" rx="7" fill="#12261b" stroke="#4ade80"/>
  <text x="1190" y="446" fill="#e2e8f0" font-size="12" text-anchor="middle">response_intent.py · recall_synthesis.py</text>
  <rect x="1050" y="466" width="280" height="34" rx="7" fill="#12261b" stroke="#4ade80"/>
  <text x="1190" y="488" fill="#e2e8f0" font-size="12" text-anchor="middle">relation.py · relation_rules.py · context.py</text>
  <rect x="1050" y="508" width="280" height="34" rx="7" fill="#12261b" stroke="#4ade80"/>
  <text x="1190" y="530" fill="#e2e8f0" font-size="12" text-anchor="middle">context_narrative · memory_anchor · memory_spatial</text>
  <rect x="1050" y="550" width="280" height="34" rx="7" fill="#12261b" stroke="#4ade80"/>
  <text x="1190" y="572" fill="#e2e8f0" font-size="12" text-anchor="middle">current_state_reasoning.py · evidence.py</text>

  <!-- Ports -->
  <rect x="50" y="640" width="620" height="90" rx="14" fill="#0e1626" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="70" y="670" fill="#c4b5fd" font-size="15" font-weight="700">OUTPUT PORTS · domain/ports/output</text>
  <text x="90" y="700" fill="#e2e8f0" font-size="13">mcp_port.py (MCPServerPort)  ·  llm_port.py (LLMServicePort)</text>
  <text x="90" y="720" fill="#94a3b8" font-size="12">adapters implement them; domain &amp; app depend only on the port</text>

  <!-- AWS / outputs -->
  <rect x="740" y="640" width="310" height="90" rx="14" fill="#1b1730" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="895" y="670" fill="#cbd5e1" font-size="14" font-weight="700" text-anchor="middle">AWS Bedrock LLM (optional)</text>
  <text x="895" y="696" fill="#94a3b8" font-size="12" text-anchor="middle">ResilientLLMAdapter → RuleBasedLLMAdapter</text>
  <text x="895" y="716" fill="#94a3b8" font-size="12" text-anchor="middle">quota fallback · not in memory path</text>

  <rect x="1070" y="640" width="280" height="90" rx="14" fill="#0e1626" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="1210" y="672" fill="#7dd3fc" font-size="14" font-weight="700" text-anchor="middle">OUTPUTS</text>
  <text x="1210" y="698" fill="#e2e8f0" font-size="12" text-anchor="middle">MCP answers → Alexa+</text>
  <text x="1210" y="718" fill="#e2e8f0" font-size="12" text-anchor="middle">SSE events → Control Center</text>

  <!-- FLOWS -->
  <line x1="215" y1="213" x2="215" y2="270" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="515" y1="213" x2="500" y2="270" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="815" y1="213" x2="800" y2="270" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a2)"/>

  <line x1="520" y1="440" x2="540" y2="440" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="1010" y1="440" x2="1030" y2="440" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a2)"/>

  <path d="M775,565 L775,610 L700,610 L700,640" fill="none" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#a2)"/>
  <path d="M960,610 L960,625 L960,640" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a2d)"/>

  <path d="M285,557 L285,600 L360,600 L360,640" fill="none" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#a2)"/>
  <path d="M1190,584 L1190,610 L1240,610 L1240,640" fill="none" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#a2)"/>

  <path d="M600,610 L540,610 L540,600" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="620" y="607" fill="#fcd34d" font-size="11">infra depends on ports</text>

  <text x="590" y="600" fill="#64748b" font-size="11"></text>
  <text x="70" y="770" fill="#94a3b8" font-size="14" font-weight="600">Data flow (always on):</text>
  <text x="70" y="796" fill="#cbd5e1" font-size="13">cameras + sensors → AmbientWatchService → EventHub(camera_alert) → MemoryBridge → VectorMemoryService</text>
  <text x="70" y="822" fill="#94a3b8" font-size="14" font-weight="600">Query flow:</text>
  <text x="70" y="848" fill="#cbd5e1" font-size="13">Alexa+ → MCP → resolvers → pure domain (router/planner/engine) → answer + evidence + trace</text>
  <text x="70" y="890" fill="#64748b" font-size="12">Note: memory path never calls Bedrock; the watchdog and bridge are edge logic, so 24/7 operation survives an AWS quota outage.</text>
</svg>
