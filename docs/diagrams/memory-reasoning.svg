<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="EchoMind V2 recall pipeline: question to plan to retrieve to evidence to episodes to relations to context to synthesis">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#101a2c"/>
    </linearGradient>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="a3t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fcd34d"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="url(#bg3)"/>
  <text x="50" y="58" fill="#f8fafc" font-size="34" font-weight="700">EchoMind V2 — Recall Pipeline</text>
  <text x="50" y="88" fill="#94a3b8" font-size="16">data → relations → context → narration → synthesis · deterministic · every claim is a retrieved fact</text>

  <!-- Stage 1: understand -->
  <rect x="50" y="140" width="250" height="150" rx="14" fill="#16233c" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="175" y="172" fill="#7dd3fc" font-size="14" font-weight="700" text-anchor="middle">1 · UNDERSTAND</text>
  <text x="70" y="200" fill="#f8fafc" font-size="14">question text</text>
  <text x="70" y="224" fill="#94a3b8" font-size="12">understand()</text>
  <text x="70" y="244" fill="#94a3b8" font-size="12">recall_planner.py</text>
  <text x="70" y="270" fill="#cbd5e1" font-size="12">→ RecallPlan slots</text>

  <!-- Stage 2: plan -->
  <rect x="340" y="130" width="300" height="170" rx="14" fill="#0f2a2f" stroke="#22d3ee" stroke-width="2"/>
  <text x="490" y="160" fill="#67e8f9" font-size="14" font-weight="700" text-anchor="middle">2 · RecallPlan</text>
  <text x="360" y="188" fill="#e2e8f0" font-size="12">ops: LAST_SEEN · SEARCH · RANGE · TOP</text>
  <text x="360" y="208" fill="#e2e8f0" font-size="12">AGGREGATE · CURRENT_STATE</text>
  <text x="360" y="228" fill="#e2e8f0" font-size="12">relations: EPISODE · SPATIAL · CORRELATION</text>
  <text x="360" y="248" fill="#e2e8f0" font-size="12">TIMELINE · BEFORE_AFTER</text>
  <text x="360" y="268" fill="#94a3b8" font-size="12">aggregation · anchor · direction</text>
  <text x="360" y="288" fill="#94a3b8" font-size="12">response_intent (A7D)</text>

  <!-- Stage 3: engine retrieve -->
  <rect x="680" y="130" width="290" height="170" rx="14" fill="#141326" stroke="#f59e0b" stroke-width="2"/>
  <text x="825" y="160" fill="#fcd34d" font-size="14" font-weight="700" text-anchor="middle">3 · RETRIEVE</text>
  <text x="700" y="188" fill="#e2e8f0" font-size="12">RecallEngine.execute()</text>
  <text x="700" y="210" fill="#94a3b8" font-size="12">last_seen · search_memory</text>
  <text x="700" y="230" fill="#94a3b8" font-size="12">records_between · top_events</text>
  <text x="700" y="250" fill="#94a3b8" font-size="12">count_occurrences · count_events</text>
  <text x="700" y="272" fill="#e2e8f0" font-size="12">→ MemoryRecord → Evidence</text>
  <text x="700" y="290" fill="#64748b" font-size="11">ops_executed trace recorded</text>

  <!-- Stage 4: relate -->
  <rect x="1010" y="130" width="340" height="170" rx="14" fill="#0d2116" stroke="#4ade80" stroke-width="2"/>
  <text x="1180" y="160" fill="#86efac" font-size="14" font-weight="700" text-anchor="middle">4 · RELATE</text>
  <text x="1030" y="188" fill="#e2e8f0" font-size="12">build_episodes() → Episode</text>
  <text x="1030" y="210" fill="#e2e8f0" font-size="12">relate_episodes() → Relation</text>
  <text x="1030" y="232" fill="#94a3b8" font-size="12">closed vocab: temporal / spatial /</text>
  <text x="1030" y="252" fill="#94a3b8" font-size="12">correlational (relation.py)</text>
  <text x="1030" y="274" fill="#e2e8f0" font-size="12">build_context() → ContextItem</text>
  <text x="1030" y="292" fill="#94a3b8" font-size="11">ranked by salience (SIGNAL/NARRATION)</text>

  <!-- Stage 5: narrate -->
  <rect x="1010" y="350" width="340" height="140" rx="14" fill="#12261b" stroke="#4ade80" stroke-width="1.6"/>
  <text x="1180" y="380" fill="#86efac" font-size="14" font-weight="700" text-anchor="middle">5 · NARRATE (A6f)</text>
  <text x="1030" y="408" fill="#e2e8f0" font-size="12">render_context(ContextItem)</text>
  <text x="1030" y="430" fill="#94a3b8" font-size="12">only narratable items speak</text>
  <text x="1030" y="450" fill="#94a3b8" font-size="12">transition · overlapping</text>
  <text x="1030" y="472" fill="#94a3b8" font-size="11">max 3 sentences · bilingual</text>

  <!-- Stage 6: synthesize -->
  <rect x="680" y="350" width="290" height="140" rx="14" fill="#2a1c0f" stroke="#f59e0b" stroke-width="2"/>
  <text x="825" y="380" fill="#fcd34d" font-size="14" font-weight="700" text-anchor="middle">6 · SYNTHESIZE (A7B/A7D)</text>
  <text x="700" y="408" fill="#e2e8f0" font-size="12">render_synthesis(plan, evidence,</text>
  <text x="700" y="428" fill="#e2e8f0" font-size="12">ops, context)</text>
  <text x="700" y="450" fill="#94a3b8" font-size="12">dispatch by ResponseIntent</text>
  <text x="700" y="472" fill="#94a3b8" font-size="11">fallback = V1 3-line narration</text>

  <!-- Response intent box -->
  <rect x="340" y="350" width="300" height="140" rx="14" fill="#16233c" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="490" y="380" fill="#7dd3fc" font-size="14" font-weight="700" text-anchor="middle">ResponseIntent (A7D)</text>
  <text x="360" y="406" fill="#e2e8f0" font-size="12">resolve_intent() / derive_intent()</text>
  <text x="360" y="428" fill="#94a3b8" font-size="12">COUNT · BEFORE · AFTER</text>
  <text x="360" y="448" fill="#94a3b8" font-size="12">LAST_SEEN_PLACE · TIMELINE · CAMERAS</text>
  <text x="360" y="468" fill="#94a3b8" font-size="12">RELATIONS · SPATIAL · SUMMARY · FALLBACK</text>

  <!-- Result -->
  <rect x="50" y="350" width="250" height="140" rx="14" fill="#0e1626" stroke="#a78bfa" stroke-width="1.8"/>
  <text x="175" y="380" fill="#c4b5fd" font-size="14" font-weight="700" text-anchor="middle">7 · RecallResult</text>
  <text x="70" y="408" fill="#e2e8f0" font-size="12">utterance (answer)</text>
  <text x="70" y="430" fill="#e2e8f0" font-size="12">evidence (proof)</text>
  <text x="70" y="452" fill="#e2e8f0" font-size="12">trace (audit)</text>
  <text x="70" y="474" fill="#94a3b8" font-size="11">/api/recall exposes all three</text>

  <!-- Arrows forward -->
  <line x1="300" y1="215" x2="340" y2="215" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="640" y1="215" x2="680" y2="215" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="970" y1="215" x2="1010" y2="215" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="1180" y1="300" x2="1180" y2="350" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="1010" y1="420" x2="970" y2="420" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="680" y1="420" x2="640" y2="420" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="340" y1="420" x2="300" y2="420" stroke="#7dd3fc" stroke-width="2" marker-end="url(#a3)"/>

  <!-- trace feeds synthesis -->
  <path d="M780,300 L780,350" fill="none" stroke="#fcd34d" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a3t)"/>
  <text x="790" y="330" fill="#fcd34d" font-size="11">trace</text>
  <!-- plan feeds synthesis -->
  <path d="M490,300 L490,350" fill="none" stroke="#67e8f9" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a3)"/>
  <text x="500" y="330" fill="#67e8f9" font-size="11">intent</text>

  <!-- Guarantees -->
  <rect x="50" y="560" width="1300" height="150" rx="14" fill="#0e1626" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="592" fill="#f8fafc" font-size="16" font-weight="700">Why the answer is honest</text>
  <text x="70" y="624" fill="#cbd5e1" font-size="13">• Closed relation vocabulary — a new relation is a table row in relation_rules.py, never a free string.</text>
  <text x="70" y="650" fill="#cbd5e1" font-size="13">• Spatial identity degrades explicitly (memory_spatial): zone→location, camera_id→source, flagged in trace.</text>
  <text x="70" y="676" fill="#cbd5e1" font-size="13">• Anchoring abstains with no match (memory_anchor) instead of approximating; direction only claims when set.</text>
  <text x="70" y="702" fill="#cbd5e1" font-size="13">• No evidence → abstention (render_abstention); every claim comes from executed trace or retrieved Evidence.</text>

  <rect x="50" y="740" width="1300" height="120" rx="14" fill="#0b0f19" stroke="#22d3ee" stroke-width="1"/>
  <text x="70" y="772" fill="#67e8f9" font-size="14" font-weight="700">Key modules (source of truth)</text>
  <text x="70" y="800" fill="#94a3b8" font-size="12">recall_planner.py · recall_plan.py · response_intent.py · recall_engine.py · memory_timeline.py</text>
  <text x="70" y="822" fill="#94a3b8" font-size="12">relation.py · relation_rules.py · context.py · context_narrative.py · memory_anchor.py · memory_spatial.py</text>
  <text x="70" y="844" fill="#94a3b8" font-size="12">evidence.py · recall_synthesis.py · memory_intent.py</text>
</svg>
