<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="EchoMind: Memory-First AI for Alexa+. Alexa+, Memory, AI, Home, IoT, Reasoning.">
  <defs>
    <linearGradient id="bn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#14213a"/>
    </linearGradient>
    <linearGradient id="bn-title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="bn-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bn-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.09"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#bn-bg)"/>
  <rect width="1280" height="400" fill="url(#bn-dots)"/>

  <!-- Echo rings + home + memory graph -->
  <circle cx="1040" cy="190" r="190" fill="url(#bn-glow)"/>
  <g fill="none" stroke="#22d3ee">
    <circle cx="1040" cy="190" r="60"  stroke-opacity="0.60" stroke-width="2"/>
    <circle cx="1040" cy="190" r="105" stroke-opacity="0.42" stroke-width="2"/>
    <circle cx="1040" cy="190" r="150" stroke-opacity="0.28" stroke-width="2" stroke-dasharray="3 9"/>
    <circle cx="1040" cy="190" r="188" stroke-opacity="0.16" stroke-width="2" stroke-dasharray="3 9"/>
  </g>
  <g stroke="#7dd3fc" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="1040" y1="190" x2="1175" y2="105"/>
    <line x1="1040" y1="190" x2="1190" y2="265"/>
    <line x1="1040" y1="190" x2="910" y2="120"/>
    <line x1="1040" y1="190" x2="895" y2="270"/>
    <line x1="1040" y1="190" x2="1085" y2="335"/>
    <line x1="1040" y1="190" x2="1000" y2="45"/>
    <line x1="1175" y1="105" x2="1000" y2="45"/>
    <line x1="910" y1="120" x2="1000" y2="45"/>
    <line x1="1190" y1="265" x2="1085" y2="335"/>
    <line x1="895" y1="270" x2="1085" y2="335"/>
  </g>
  <circle cx="1175" cy="105" r="9" fill="#f59e0b"/>
  <circle cx="1190" cy="265" r="9" fill="#4ade80"/>
  <circle cx="910"  cy="120" r="9" fill="#a78bfa"/>
  <circle cx="895"  cy="270" r="9" fill="#f59e0b"/>
  <circle cx="1085" cy="335" r="8" fill="#22d3ee"/>
  <circle cx="1000" cy="45"  r="8" fill="#4ade80"/>
  <!-- home -->
  <g stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" fill="#0b0f19">
    <path d="M1000,192 L1040,152 L1080,192 L1080,232 L1000,232 Z"/>
  </g>
  <rect x="1028" y="202" width="24" height="30" rx="3" fill="#22d3ee"/>

  <!-- Wordmark -->
  <text x="60" y="130" fill="url(#bn-title)" font-size="88" font-weight="700">EchoMind</text>
  <text x="62" y="182" fill="#f8fafc" font-size="36" font-weight="600">Memory-First AI for Alexa+</text>
  <text x="62" y="228" fill="#cbd5e1" font-size="21">Observe → Remember → Recall → Relate → Reason → Respond</text>
  <text x="62" y="262" fill="#94a3b8" font-size="18">deterministic · bilingual · 24/7 without AWS</text>

  <!-- Chips -->
  <g font-size="22" font-weight="600" text-anchor="middle" fill="#f8fafc">
    <rect x="60"  y="292" width="120" height="44" rx="22" fill="#16233c" stroke="#38bdf8" stroke-width="1.5"/><text x="120" y="321">Alexa+</text>
    <rect x="194" y="292" width="130" height="44" rx="22" fill="#16233c" stroke="#a78bfa" stroke-width="1.5"/><text x="259" y="321">Memory</text>
    <rect x="338" y="292" width="80"  height="44" rx="22" fill="#16233c" stroke="#22d3ee" stroke-width="1.5"/><text x="378" y="321">AI</text>
    <rect x="432" y="292" width="100" height="44" rx="22" fill="#16233c" stroke="#4ade80" stroke-width="1.5"/><text x="482" y="321">Home</text>
    <rect x="546" y="292" width="90"  height="44" rx="22" fill="#16233c" stroke="#f59e0b" stroke-width="1.5"/><text x="591" y="321">IoT</text>
    <rect x="650" y="292" width="150" height="44" rx="22" fill="#16233c" stroke="#38bdf8" stroke-width="1.5"/><text x="725" y="321">Reasoning</text>
  </g>

  <text x="62" y="372" fill="#94a3b8" font-size="16">Built for the Amazon Developer Hackathon 2026 · Build, Ship, Shape</text>
</svg>
